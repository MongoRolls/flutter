name: Build Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: >
          flutter build apk --split-per-abi
          --dart-define=BACKEND_URL=https://api.mongorolls.cn
          --dart-define=DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: flutter/build/app/outputs/flutter-apk/*.apk

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: >
          flutter build web
          --dart-define=BACKEND_URL=https://api.mongorolls.cn

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: flutter/build/web
