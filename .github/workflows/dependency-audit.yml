name: Dependency audit
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  audit-1:
    name: Audit web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      npm_config_manage_package_manager_versions: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install audit guard parser
      run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: Test fail-closed audit guards
      run: python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
    - name: Audit dependency metadata (no lifecycle scripts)
      run: 'npm install --global --ignore-scripts pnpm@8.15.9

        python3 ../.github/scripts/audit_pnpm.py'
  audit-backend:
    name: Audit backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      npm_config_manage_package_manager_versions: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install audit guard parser
      run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: Test fail-closed audit guards
      run: python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
    - name: Audit dependency metadata (no lifecycle scripts)
      run: 'npm install --global --ignore-scripts pnpm@10.28.2

        python3 ../.github/scripts/audit_pnpm.py'
  audit-pub:
    name: Pub SDK advisory hints (limited coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - name: Check SDK hints, not a complete vulnerability scan
      run: |
        echo "::warning::Pub coverage is limited to SDK advisory hints. A false flag cannot prove upstream availability or absence of vulnerabilities."
        flutter pub outdated --json --up-to-date > /tmp/pub-hints.json
        python3 ../.github/scripts/check_pub_hints.py < /tmp/pub-hints.json
