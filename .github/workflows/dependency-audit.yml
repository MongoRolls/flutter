name: Dependency audit
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  audit-1:
    name: Audit web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      npm_config_manage_package_manager_versions: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Audit dependency metadata (no lifecycle scripts)
      run: 'npm install --global --ignore-scripts pnpm@10.28.2

        pnpm audit --audit-level=low --registry=https://registry.npmjs.org'
  audit-backend:
    name: Audit backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      npm_config_manage_package_manager_versions: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Audit dependency metadata (no lifecycle scripts)
      run: 'npm install --global --ignore-scripts pnpm@10.28.2

        pnpm audit --audit-level=low --registry=https://registry.npmjs.org'
  audit-pub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: "flutter pub outdated --json --up-to-date > /tmp/pub-audit.json\npython3\
        \ - <<'PY'\nimport json\nwith open('/tmp/pub-audit.json') as f: packages=json.load(f)['packages']\n\
        if not packages or any('isCurrentAffectedByAdvisory' not in p for p in packages):\n\
        \    raise SystemExit('Pub did not return complete advisory data')\naffected=[p['package']\
        \ for p in packages if p['isCurrentAffectedByAdvisory']]\nprint('Packages\
        \ affected by advisories:', affected)\nraise SystemExit(bool(affected))\n\
        PY"
